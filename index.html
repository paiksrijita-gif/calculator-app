<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <meta name="description" content="A basic and scientific calculator with history, memory and keyboard support.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" id="calc" aria-label="Calculator">
    <header class="topbar">
      <div class="segmented" role="tablist" aria-label="Calculator mode">
        <button role="tab" data-mode="basic" aria-selected="true">Basic</button>
        <button role="tab" data-mode="sci" aria-selected="false">Scientific</button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="historyBtn" aria-label="Show history" title="History">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme" title="Theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </header>

    <section class="display">
      <div class="status">
        <span class="tag" id="angleTag">DEG</span>
        <span class="tag" id="secondTag" hidden>2nd</span>
        <span class="tag" id="memTag" hidden>M</span>
      </div>
      <div class="expression" id="expression"></div>
      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <div class="memory-row" aria-label="Memory">
      <button data-key="mc" title="Clear memory">MC</button>
      <button data-key="mr" title="Recall memory">MR</button>
      <button data-key="m+" title="Add to memory">M+</button>
      <button data-key="m-" title="Subtract from memory">M−</button>
    </div>

    <div class="pad">
      <div class="sci-keys" aria-label="Scientific functions">
        <button class="key sci toggle" data-key="second" aria-pressed="false">2nd</button>
        <button class="key sci" data-key="angle" id="angleKey">DEG</button>
        <button class="key sci" data-key="(">(</button>
        <button class="key sci" data-key=")">)</button>
        <button class="key sci" data-key="mod">mod</button>

        <button class="key sci" data-key="sin" data-alt="asin"><span class="main">sin</span><span class="alt">sin⁻¹</span></button>
        <button class="key sci" data-key="cos" data-alt="acos"><span class="main">cos</span><span class="alt">cos⁻¹</span></button>
        <button class="key sci" data-key="tan" data-alt="atan"><span class="main">tan</span><span class="alt">tan⁻¹</span></button>
        <button class="key sci" data-key="ln" data-alt="exp"><span class="main">ln</span><span class="alt">eˣ</span></button>
        <button class="key sci" data-key="log" data-alt="pow10"><span class="main">log</span><span class="alt">10ˣ</span></button>

        <button class="key sci" data-key="sq" data-alt="cube"><span class="main">x²</span><span class="alt">x³</span></button>
        <button class="key sci" data-key="^">xʸ</button>
        <button class="key sci" data-key="sqrt" data-alt="cbrt"><span class="main">√x</span><span class="alt">∛x</span></button>
        <button class="key sci" data-key="fact">x!</button>
        <button class="key sci" data-key="inv">1/x</button>

        <button class="key sci" data-key="pi">π</button>
        <button class="key sci" data-key="e">e</button>
        <button class="key sci" data-key="ans">Ans</button>
        <button class="key sci" data-key="abs">|x|</button>
        <button class="key sci" data-key="ee" title="Times ten to the power">EE</button>
      </div>

      <div class="basic-keys">
        <button class="key fn" data-key="clear">AC</button>
        <button class="key fn" data-key="back" aria-label="Backspace">⌫</button>
        <button class="key fn" data-key="pct" aria-label="Percent">%</button>
        <button class="key op" data-key="/" aria-label="Divide">÷</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key op" data-key="*" aria-label="Multiply">×</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key op" data-key="-" aria-label="Subtract">−</button>

        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key op" data-key="+" aria-label="Add">+</button>

        <button class="key" data-key="negate" aria-label="Plus minus">±</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key="." aria-label="Decimal point">.</button>
        <button class="key equals" data-key="=" aria-label="Equals">=</button>
      </div>
    </div>

    <aside class="history" id="history" aria-label="History" hidden>
      <div class="history-head">
        <h2>History</h2>
        <div>
          <button class="text-btn" id="clearHistory">Clear</button>
          <button class="icon-btn" id="closeHistory" aria-label="Close history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <ol class="history-list" id="historyList"></ol>
      <p class="history-empty" id="historyEmpty">No calculations yet.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
